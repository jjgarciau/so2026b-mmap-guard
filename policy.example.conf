# policy.example.conf - Política de ejemplo para mmap_guard
#
# Formato:  <ruta>  <uid_autorizado | ->  <reglas>
#
#   uid_autorizado  UID exento de la regla ("-" = nadie, ni siquiera root)
#   reglas          separadas por coma:
#       shared-write   niega MAP_SHARED + PROT_WRITE (modificar el archivo vía mmap)
#       private-write  niega MAP_PRIVATE + PROT_WRITE (copias COW alterables)
#       write          = shared-write + private-write
#       exec           niega PROT_EXEC (ejecutar código desde el archivo)
#       all            niega cualquier mmap() del archivo
#
# La regla se aplica sobre el INODO del archivo: enlaces simbólicos, enlaces
# duros y renombrados no la eluden. Las mismas reglas se aplican en mprotect().

/home/juan_urrego/entrega3/secreto.dat   -      write,exec
/home/juan_urrego/entrega3/config.dat    1000   shared-write
